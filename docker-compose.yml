version: '3.8'

services:
  pipeline-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber_threat_dashboard
    ports:
      - "${PORT:-8501}:8501"
    env_file:
      - .env
    volumes:
      # Mount codebase for hot reloading during development
      - .:/app
      # Ensure data and models directories are mounted to persist files generated inside the container
      - ./data:/app/data
      - ./models:/app/models
      - ./notebooks:/app/notebooks
    restart: unless-stopped
    stdin_open: true
    tty: true
